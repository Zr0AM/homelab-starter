plugins {
	id 'java-library'
	id 'maven-publish'
	id 'jacoco'
	id 'org.jsonschema2pojo' version '1.3.3'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "7.5.0.8588"
}

group = 'com.zr0am'

// GitHub Packages versions are immutable — republishing the same coordinates is rejected. CI
// therefore stamps every run with its own version so pushes to main never collide. Local builds
// stay on SNAPSHOT, which mavenLocal is happy to overwrite. Bump baseVersion for a real release.
def baseVersion = '0.0.1'
def buildNumber = System.getenv('GITHUB_RUN_NUMBER')
version = (buildNumber ? "${baseVersion}-build.${buildNumber}" : "${baseVersion}-SNAPSHOT").toString()

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
	withJavadocJar()
}

repositories {
	mavenCentral()
}

configurations {
	mockitoAgent
}

dependencies {
	// Exposed transitively to consumers of this starter library
	api libs.spring.boot.starter.webmvc
	api libs.spring.boot.starter.actuator
	api libs.spring.boot.starter.validation
	api libs.springdoc.openapi
	api libs.resilience4j

	// Internal implementation details
	implementation libs.logback.ecs

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testImplementation(libs.mockito)
	mockitoAgent(libs.mockito) {
		transitive = false
	}
}

jar {
	enabled = true
	archiveClassifier = ''
}

// Disable executable fat-jar creation for a reusable library
bootJar {
	enabled = false
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
	finalizedBy jacocoTestReport
}

tasks.named('check') {
	dependsOn jacocoTestReport
}

jsonSchema2Pojo {
	source = files("${projectDir}/src/main/json")
	targetDirectory = file("${layout.buildDirectory.get()}/generated-sources/js2p")
	targetPackage = 'com.zr0am.model'
	annotationStyle = 'jackson2'
	dateTimeType = 'java.time.Instant'
}

sourceSets.main.java.srcDirs += "${layout.buildDirectory.get()}/generated-sources/js2p"

tasks.named('generateJsonSchema2Pojo') {
	onlyIf { file("${projectDir}/src/main/json").exists() }
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:all', '-Xlint:-processing']
}

tasks.named('compileJava') {
	dependsOn tasks.named('generateJsonSchema2Pojo')
}

tasks.named('sourcesJar') {
	dependsOn tasks.named('generateJsonSchema2Pojo')
}

tasks.withType(Javadoc).configureEach {
	options.addStringOption('Xdoclint:none', '-quiet')
}

sonar {
	properties {
		property "sonar.projectKey", "Zr0AM_homelab-starter"
		property "sonar.organization", "zr0am"
		property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
	}
}

tasks.named('sonar') {
	dependsOn jacocoTestReport
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			artifactId = 'homelab-starter'
			pom {
				name = 'homelab-starter'
				description = 'Starter library for homelab API services'
				url = 'https://github.com/Zr0AM/homelab-starter'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
				scm {
					connection = 'scm:git:git://github.com/Zr0AM/homelab-starter.git'
					developerConnection = 'scm:git:ssh://github.com:Zr0AM/homelab-starter.git'
					url = 'https://github.com/Zr0AM/homelab-starter'
				}
			}
		}
	}
	repositories {
		maven {
			name = 'GitHubPackages'
			url = uri('https://maven.pkg.github.com/Zr0AM/homelab-starter')
			credentials {
				username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
				password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
			}
		}
	}
}
